name: ghostpilot prebuilt
on:
  workflow_dispatch:

jobs:
  build_prebuilt:
    name: build ghostpilot prebuilt
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        ref: ghostpilot
        submodules: true
        fetch-depth: 1
        lfs: true

    - name: Set up QEMU for aarch64
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Remove macOS venv if present
      run: rm -rf .venv

    - name: Build in aarch64 container
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/openpilot \
          -w /openpilot \
          ubuntu:24.04 bash -c '
            set -e

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential git curl python3 python3-venv \
              libffi-dev libssl-dev pkg-config \
              gcc-arm-none-eabi ca-certificates \
              llvm-dev libllvm18 clang

            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="/root/.local/bin:$PATH"

            uv sync --frozen --all-extras
            source .venv/bin/activate
            scons -j$(nproc) --minimal
            cd panda && scons -j$(nproc) && cd ..

            # Clean intermediate build artifacts (keep .so, .pkl, firmware)
            find . -name "*.o" -delete
            find . -name "*.os" -delete
            find . -name "*.a" -not -path "./third_party/*" -delete
            find . -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -name ".sconsign.dblite" -delete

            touch prebuilt
          '

    - name: Create flat prebuilt branch
      run: |
        # Remove all .git dirs from submodules so they commit as flat files
        find . -mindepth 2 -name ".git" -exec rm -rf {} + 2>/dev/null || true
        rm -f .gitmodules

        # Re-init as a fresh repo
        rm -rf .git
        git init
        git config user.name "ghostdev"
        git config user.email "ghostdev137@users.noreply.github.com"
        git add -f .
        git commit -m "ghostpilot prebuilt $(date -u +%Y-%m-%d)"
        git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    - name: Push prebuilt branch and LFS
      run: |
        GIT_LFS_SKIP_PUSH=1 git push -f origin HEAD:ghostpilot-prebuilt
        git lfs push origin HEAD --all
