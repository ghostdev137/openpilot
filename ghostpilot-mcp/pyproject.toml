[project]
name = "ghostpilot-mcp"
version = "0.1.0"
description = "MCP server for openpilot / ghostpilot"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "websockets>=12.0",
  "opendbc",
]

[project.scripts]
ghostpilot-mcp = "server.mcp_server:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"
